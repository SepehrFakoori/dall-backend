services:
  db:
    container_name: dall_db
    env_file:
      - envs/.env.prod
    ports:
      - "5432:5432"

  backend:
    container_name: dall_backend
    env_file:
      - envs/.env.prod
    ports:
      - "8000:8000"
    command:
      - sh
      - -c
      - python manage.py migrate --noinput && exec gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3
    volumes:
      - .:/usr/src/core
