services:
  db:
    container_name: dall_db
    env_file:
      - envs/.env.prod
    ports:
      - "5432:5432"

  mcp:
    container_name: dall_mcp
    env_file:
      - envs/.env.prod
    ports:
      - "8001:8001"
    command:
      - python
      - -m
      - uvicorn
      - config.mcp:application
      - --host
      - 0.0.0.0
      - --port
      - "8001"
      - --reload
    volumes:
      - .:/usr/src/core

  backend:
    container_name: dall_backend
    env_file:
      - envs/.env.prod
    ports:
      - "8000:8000"
    command:
      - sh
      - -c
      - python manage.py migrate --noinput && exec gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3
    volumes:
      - .:/usr/src/core
