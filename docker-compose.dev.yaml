services:
  db:
    container_name: dall_db_dev
    env_file:
      - envs/.env.dev
    ports:
      - "5432:5432"

  backend:
    container_name: dall_backend_dev
    env_file:
      - envs/.env.dev
    ports:
      - "8000:8000"
    command:
      - sh
      - -c
      - python manage.py migrate --noinput && exec python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/usr/src/core
