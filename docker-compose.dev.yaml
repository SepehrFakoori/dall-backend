services:
  db:
    container_name: dall_db_dev
    env_file:
      - envs/.env.dev
    ports:
      - "5432:5432"

  mcp:
    container_name: dall_mcp_dev
    env_file:
      - envs/.env.dev
    ports:
      - "8001:8001"
    command:
      - python
      - -m
      - uvicorn
      - config.mcp:application
      - --host
      - 0.0.0.0
      - --port
      - "8001"
      - --reload
    volumes:
      - .:/usr/src/core

  backend:
    container_name: dall_backend_dev
    env_file:
      - envs/.env.dev
    ports:
      - "8000:8000"
    command:
      - sh
      - -c
      - exec python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/usr/src/core
